<!doctype html>
<html lang="%PROFILE_LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%PROFILE_THEME_COLOR%" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="%PROFILE_DESCRIPTION%" />
    <meta name="author" content="%PROFILE_AUTHOR%" />
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="%PROFILE_LOCALE%" />
    <meta property="og:title" content="%PROFILE_OG_TITLE%" />
    <meta property="og:description" content="%PROFILE_OG_DESCRIPTION%" />
    <meta property="og:image" content="%BASE_URL%%PROFILE_OG_IMAGE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes de la plantilla del perfil (profile.json → fontsHref). -->
    <link href="%PROFILE_FONTS_HREF%" rel="stylesheet" />
    <script>document.documentElement.classList.add('js');</script>
    <title>%PROFILE_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
